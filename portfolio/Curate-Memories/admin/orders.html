<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | Curate Memories</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <style>

        body {
            background: #f4f0ea;
            color: #111;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .admin-header p {
            margin: 6px 0 0;
            color: #777;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
        }

        .admin-button {
            border: 1px solid #111;
            background: #111;
            color: #fff;
            padding: 12px 18px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-button.secondary {
            background: transparent;
            color: #111;
        }

        .orders-grid {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #ddd5cc;
            padding: 24px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .order-number {
            font-size: 20px;
            font-weight: 600;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .order-customer {
            margin-bottom: 20px;
        }

        .order-customer strong {
            display: block;
            margin-bottom: 5px;
        }

        .order-customer span {
            display: block;
            color: #555;
            margin-top: 3px;
        }

        .order-items {
            border-top: 1px solid #e5ded6;
            border-bottom: 1px solid #e5ded6;
            padding: 15px 0;
            margin-bottom: 18px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 7px 0;
        }

        .order-item-name {
            font-weight: 500;
        }

        .order-item-meta {
            color: #777;
            font-size: 14px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 19px;
            margin-bottom: 20px;
        }

        .order-notes {
            background: #f8f5f1;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .order-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 7px;
            color: #666;
        }

        .control-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 14px;
        }

        .empty-orders {
            background: #fff;
            border: 1px solid #ddd5cc;
            padding: 60px 20px;
            text-align: center;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #777;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
            background: #eee;
        }

        .status.new {
            background: #eee8df;
        }

        .status.processing {
            background: #e5e1d8;
        }

        .status.completed {
            background: #dfe8df;
        }

        .status.cancelled {
            background: #eadfdf;
        }

        .payment-paid {
            color: #386b3f;
            font-weight: 600;
        }

        .payment-unpaid {
            color: #9a5c2f;
            font-weight: 600;
        }

        .orders-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 25px; }
        .summary-card { background: #fff; border: 1px solid #ddd5cc; padding: 20px; }
        .summary-card span { display: block; color: #777; font-size: 10px; letter-spacing: .1em; margin-bottom: 10px; }
        .summary-card strong { font-size: 24px; font-weight: 500; }
        @media (max-width: 900px) { .orders-summary { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .orders-summary { grid-template-columns: repeat(2, 1fr); } .summary-card { padding: 16px; } .summary-card strong { font-size: 20px; } }

        .customer-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            padding: 10px 14px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .customer-whatsapp:hover {
            opacity: .85;
        }

        .order-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .order-filter {
            border: 1px solid #d5cec6;
            background: #fff;
            color: #555;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .order-filter:hover {
            border-color: #111;
            color: #111;
        }

        .order-filter.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .status-saving {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            color: #777;
        }

        .control-group select.is-saving {
            opacity: .6;
            pointer-events: none;
        }

        .orders-search {
            margin-bottom: 12px;
        }

        .orders-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #d5cec6;
            background: #fff;
            color: #111;
            font-size: 14px;
            outline: none;
        }

        .orders-search input:focus {
            border-color: #111;
        }

        @media (max-width: 600px) {

            .orders-search {
                margin-bottom: 10px;
            }

            .order-filters {
                gap: 6px;
                margin-bottom: 16px;
            }

            .order-filter {
                padding: 9px 11px;
                font-size: 11px;
            }

            .order-card {
                padding: 18px;
            }

            .order-top {
                gap: 12px;
            }

            .order-item {
                align-items: flex-start;
            }

            .order-item > strong {
                white-space: nowrap;
            }

            .customer-whatsapp {
                width: 100%;
                box-sizing: border-box;
            }

        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-top {
                flex-direction: column;
            }

            .order-controls {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <main class="admin-container">

        <div class="admin-header">

            <div>
                <h1>Orders</h1>
                <p>Manage Curate Memories orders</p>
            </div>

            <div class="admin-actions">

                <a
                    href="dashboard.html"
                    class="admin-button secondary">
                    Products
                </a>

                <button
                    id="logoutButton"
                    class="admin-button">
                    Logout
                </button>

            </div>

        </div>

        <div class="orders-summary">

            <div class="summary-card"><span>TOTAL ORDERS</span><strong id="summaryTotal">0</strong></div>
            <div class="summary-card"><span>NEW</span><strong id="summaryNew">0</strong></div>
            <div class="summary-card"><span>PROCESSING</span><strong id="summaryProcessing">0</strong></div>
            <div class="summary-card"><span>COMPLETED</span><strong id="summaryCompleted">0</strong></div>
            <div class="summary-card"><span>REVENUE</span><strong id="summaryRevenue">R0</strong></div>

        </div>

        <div class="orders-search">
            <input
                type="search"
                id="orderSearch"
                placeholder="Search by customer, phone or order number..."
                autocomplete="off">
        </div>

        <div class="order-filters">

            <button class="order-filter active" data-filter="all">
                All
            </button>

            <button class="order-filter" data-filter="new">
                New
            </button>

            <button class="order-filter" data-filter="processing">
                Processing
            </button>

            <button class="order-filter" data-filter="completed">
                Completed
            </button>

            <button class="order-filter" data-filter="cancelled">
                Cancelled
            </button>

        </div>

        <div id="ordersContainer">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </main>


    <script>

        let orders = [];
        let currentOrderFilter = "all";
        let currentOrderSearch = "";

        document.addEventListener("DOMContentLoaded", async function () {

            /* =========================
               CHECK LOGIN
            ========================= */

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "index.html";
                return;
            }


            /* =========================
               LOGOUT
            ========================= */

            document
                .getElementById("logoutButton")
                .addEventListener("click", async function () {

                    await supabaseClient.auth.signOut();

                    window.location.href = "index.html";

                });


            document.querySelectorAll(".order-filter").forEach(function (button) {

                button.addEventListener("click", function () {

                    document.querySelectorAll(".order-filter").forEach(function (item) {
                        item.classList.remove("active");
                    });

                    button.classList.add("active");

                    currentOrderFilter = button.dataset.filter;

                    renderOrders();

                });

            });


            /* =========================
               LOAD ORDERS
            ========================= */

            await loadOrders();

            /* =========================
               AUTO REFRESH ORDERS
            ========================= */

            setInterval(async function () {
                await loadOrders();
            }, 30000);

        });


        async function loadOrders() {

            const container =
                document.getElementById("ordersContainer");

            const {
                data: orderData,
                error: orderError
            } = await supabaseClient
                .from("orders")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


            if (orderError) {

                console.error(orderError);

                container.innerHTML = `
                    <div class="empty-orders">
                        <h3>Unable to load orders</h3>
                        <p>${orderError.message}</p>
                    </div>
                `;

                return;
            }


            orders = orderData || [];

            const totalOrders = orders.length;
            const newOrders = orders.filter(function (order) { return order.status === "new"; }).length;
            const processingOrders = orders.filter(function (order) { return order.status === "processing"; }).length;
            const completedOrders = orders.filter(function (order) { return order.status === "completed"; }).length;
            const revenue = orders.reduce(function (total, order) { return total + Number(order.total || 0); }, 0);

            document.getElementById("summaryTotal").textContent = totalOrders;
            document.getElementById("summaryNew").textContent = newOrders;
            document.getElementById("summaryProcessing").textContent = processingOrders;
            document.getElementById("summaryCompleted").textContent = completedOrders;
            document.getElementById("summaryRevenue").textContent = "R" + revenue.toLocaleString("en-ZA");

            if (orders.length === 0) {

                container.innerHTML = `
                    <div class="empty-orders">
                        <h3>No orders yet</h3>
                        <p>New customer orders will appear here.</p>
                    </div>
                `;

                return;
            }


            renderOrders();

            await loadOrderItems();

        }


        function renderOrders() {

            const container =
                document.getElementById("ordersContainer");

            let filteredOrders = orders;

            if (currentOrderFilter !== "all") {

                filteredOrders = filteredOrders.filter(function (order) {
                    return order.status === currentOrderFilter;
                });

            }

            if (currentOrderSearch) {

                filteredOrders = filteredOrders.filter(function (order) {

                    const orderNumber =
                        String(order.id || "").toLowerCase();

                    const customerName =
                        String(order.customer_name || "").toLowerCase();

                    const customerPhone =
                        String(order.customer_phone || "").toLowerCase();

                    return (
                        orderNumber.includes(currentOrderSearch) ||
                        customerName.includes(currentOrderSearch) ||
                        customerPhone.includes(currentOrderSearch)
                    );

                });

            }

            if (filteredOrders.length === 0) {

                container.innerHTML = `
                    <div class="empty-orders">
                        <h3>No matching orders</h3>
                        <p>There are no orders in this category.</p>
                    </div>
                `;

                return;
            }

            container.innerHTML = `
                <div class="orders-grid">
                    ${filteredOrders.map(function (order) {

                        return `
                            <div
                                class="order-card"
                                id="order-${order.id}">

                                <div class="order-top">

                                    <div>
                                        <div class="order-number">
                                            Order #${order.id}
                                        </div>

<div class="order-date">
    Created: ${formatDate(order.created_at)}
    <br>
    Updated: ${formatDate(order.updated_at)}
</div>
                                    </div>

                                    <span
                                        class="status ${order.status}">
                                        ${order.status}
                                    </span>

                                </div>

                                <div class="order-customer">

                                    <strong>
                                        ${escapeHtml(order.customer_name)}
                                    </strong>

                                    <span>
                                        WhatsApp:
                                        ${escapeHtml(order.customer_phone)}
                                    </span>

                                    ${
                                        order.customer_email
                                        ? `
                                            <span>
                                                Email:
                                                ${escapeHtml(order.customer_email)}
                                            </span>
                                        `
                                        : ""
                                    }

                                </div>

                                <a
                                    class="customer-whatsapp"
                                    href="https://wa.me/${normalizeWhatsAppNumber(order.customer_phone)}"
                                    target="_blank"
                                    rel="noopener">
                                    WhatsApp Customer →
                                </a>

                                <div
                                    class="order-items"
                                    id="items-${order.id}">

                                    Loading items...

                                </div>

                                <div class="order-total">

                                    <strong>
                                        Total
                                    </strong>

                                    <strong>
                                        R${Number(order.total)
                                            .toLocaleString("en-ZA", {
                                                minimumFractionDigits: 2
                                            })}
                                    </strong>

                                </div>

                                ${
                                    order.notes
                                    ? `
                                        <div class="order-notes">
                                            <strong>Notes:</strong><br>
                                            ${escapeHtml(order.notes)}
                                        </div>
                                    `
                                    : ""
                                }

   <div class="order-controls">

    <div class="control-group">

        <label>
            Order status
        </label>

        <select
            onchange="updateOrderStatus(
                ${order.id},
                this.value,
                this
            )">

            <option
                value="new"
                ${order.status === "new" ? "selected" : ""}>
                New
            </option>

            <option
                value="processing"
                ${order.status === "processing" ? "selected" : ""}>
                Processing
            </option>

            <option
                value="completed"
                ${order.status === "completed" ? "selected" : ""}>
                Completed
            </option>

            <option
                value="cancelled"
                ${order.status === "cancelled" ? "selected" : ""}>
                Cancelled
            </option>

        </select>

    </div>


    <div class="control-group">

        <label>
            Payment
        </label>

        <select
            onchange="updatePaymentStatus(
                ${order.id},
                this.value,
                this
            )">

            <option
                value="unpaid"
                ${order.payment_status === "unpaid" ? "selected" : ""}>
                Unpaid
            </option>

            <option
                value="paid"
                ${order.payment_status === "paid" ? "selected" : ""}>
                Paid
            </option>

        </select>

    </div>


    <div class="control-group">

        <label>
            Payment method
        </label>

        <select
            onchange="updatePaymentMethod(
                ${order.id},
                this.value,
                this
            )">

            <option
                value=""
                ${!order.payment_method ? "selected" : ""}>
                Not selected
            </option>

            <option
                value="EFT"
                ${order.payment_method === "EFT" ? "selected" : ""}>
                EFT
            </option>

            <option
                value="Card"
                ${order.payment_method === "Card" ? "selected" : ""}>
                Card
            </option>

            <option
                value="Cash"
                ${order.payment_method === "Cash" ? "selected" : ""}>
                Cash
            </option>

            <option
                value="Other"
                ${order.payment_method === "Other" ? "selected" : ""}>
                Other
            </option>

        </select>

    </div>

</div>

                            </div>
                        `;

                    }).join("")}
                </div>
            `;

            loadOrderItems();

        }


        async function loadOrderItems() {

            const {
                data,
                error
            } = await supabaseClient
                .from("order_items")
                .select("*")
                .order("id", {
                    ascending: true
                });


            if (error) {

                console.error(error);
                return;

            }


            data.forEach(function (item) {

                const container =
                    document.getElementById(
                        "items-" + item.order_id
                    );

                if (!container) return;


                if (
                    container.innerHTML.trim() ===
                    "Loading items..."
                ) {

                    container.innerHTML = "";

                }


                const row =
                    document.createElement("div");

                row.className = "order-item";

                row.innerHTML = `
                    <div>

                        <div class="order-item-name">
                            ${escapeHtml(item.product_name)}
                        </div>

                        <div class="order-item-meta">
                            R${Number(item.price)
                                .toLocaleString("en-ZA")}
                            × ${item.quantity}
                        </div>

                    </div>

                    <strong>
                        R${Number(item.subtotal)
                            .toLocaleString("en-ZA")}
                    </strong>
                `;

                container.appendChild(row);

            });


            orders.forEach(function (order) {

                const container =
                    document.getElementById(
                        "items-" + order.id
                    );

                if (
                    container &&
                    container.innerHTML.trim() === ""
                ) {

                    container.innerHTML =
                        `<span class="order-item-meta">
                            No items found.
                        </span>`;

                }

            });

        }


        async function updateOrderStatus(
            orderId,
            status,
            selectElement
        ) {

            if (selectElement) {
                selectElement.classList.add("is-saving");
            }

            const card =
                document.getElementById("order-" + orderId);

            let indicator = null;

            if (card) {
                indicator =
                    card.querySelector(".status-saving");

                if (!indicator) {
                    indicator =
                        document.createElement("span");

                    indicator.className = "status-saving";
                    indicator.textContent = "Saving...";

                    const controls =
                        card.querySelector(".order-controls");

                    if (controls) {
                        controls.appendChild(indicator);
                    }
                }
            }

            const {
                error
            } = await supabaseClient
                .from("orders")
                .update({
                    status: status
                })
                .eq("id", orderId);

            if (error) {

                if (selectElement) {
                    selectElement.classList.remove("is-saving");
                }

                if (indicator) {
                    indicator.textContent =
                        "Could not save — please try again.";
                }

                alert(
                    "Could not update order: " +
                    error.message
                );

                return;
            }

            const order = orders.find(function (item) {
                return item.id === orderId;
            });

            if (order) {
                order.status = status;
            }

            if (indicator) {
                indicator.textContent = "Saved ✓";

                setTimeout(function () {
                    if (indicator) {
                        indicator.remove();
                    }
                }, 1800);
            }

            if (selectElement) {
                selectElement.classList.remove("is-saving");
            }

            renderOrders();
        }


   async function updatePaymentStatus(
    orderId,
    paymentStatus,
    selectElement
) {

    if (selectElement) {
        selectElement.classList.add("is-saving");
        selectElement.disabled = true;
    }

    const card =
        document.getElementById("order-" + orderId);

    let indicator = null;

    if (card) {
        indicator =
            card.querySelector(".status-saving");

        if (!indicator) {
            indicator =
                document.createElement("span");

            indicator.className = "status-saving";
            indicator.textContent = "Saving...";

            const controls =
                card.querySelector(".order-controls");

            if (controls) {
                controls.appendChild(indicator);
            }
        }
    }

    let paymentUpdate = {
        payment_status: paymentStatus
    };

    /*
     * When payment is confirmed:
     * record the exact time and logged-in admin.
     */
    if (paymentStatus === "paid") {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        paymentUpdate.paid_at = new Date().toISOString();
        paymentUpdate.paid_by =
            user ? user.email : null;

    } else {

        /*
         * If payment is changed back to unpaid,
         * clear the payment confirmation details.
         */
        paymentUpdate.paid_at = null;
        paymentUpdate.paid_by = null;

    }

    const {
        error
    } = await supabaseClient
        .from("orders")
        .update(paymentUpdate)
        .eq("id", orderId);

    if (error) {

        if (selectElement) {
            selectElement.classList.remove("is-saving");
            selectElement.disabled = false;
        }

        if (indicator) {
            indicator.textContent =
                "Could not save — please try again.";
        }

        alert(
            "Could not update payment: " +
            error.message
        );

        return;
    }

    const order = orders.find(function (item) {
        return item.id === orderId;
    });

    if (order) {

        order.payment_status =
            paymentStatus;

        order.paid_at =
            paymentUpdate.paid_at;

        order.paid_by =
            paymentUpdate.paid_by;

    }

    if (indicator) {

        indicator.textContent =
            "Saved ✓";

        setTimeout(function () {

            if (indicator) {
                indicator.remove();
            }

        }, 1800);
    }

    if (selectElement) {
        selectElement.classList.remove("is-saving");
        selectElement.disabled = false;
    }

    renderOrders();
}
async function updatePaymentMethod(
    orderId,
    paymentMethod,
    selectElement
) {

    if (selectElement) {
        selectElement.classList.add("is-saving");
        selectElement.disabled = true;
    }

    const card =
        document.getElementById("order-" + orderId);

    let indicator = null;

    if (card) {
        indicator =
            card.querySelector(".status-saving");

        if (!indicator) {
            indicator =
                document.createElement("span");

            indicator.className = "status-saving";
            indicator.textContent = "Saving...";

            const controls =
                card.querySelector(".order-controls");

            if (controls) {
                controls.appendChild(indicator);
            }
        }
    }

    const {
        error
    } = await supabaseClient
        .from("orders")
        .update({
            payment_method:
                paymentMethod || null
        })
        .eq("id", orderId);

    if (error) {

        if (selectElement) {
            selectElement.classList.remove("is-saving");
            selectElement.disabled = false;
        }

        if (indicator) {
            indicator.textContent =
                "Could not save — please try again.";
        }

        alert(
            "Could not update payment method: " +
            error.message
        );

        return;
    }

    const order =
        orders.find(function (item) {
            return item.id === orderId;
        });

    if (order) {
        order.payment_method =
            paymentMethod || null;
    }

    if (indicator) {

        indicator.textContent =
            "Saved ✓";

        setTimeout(function () {

            if (indicator) {
                indicator.remove();
            }

        }, 1800);
    }

    if (selectElement) {
        selectElement.classList.remove("is-saving");
        selectElement.disabled = false;
    }

    renderOrders();
}

        function normalizeWhatsAppNumber(phone) {

            let number =
                String(phone || "").replace(/\D/g, "");

            if (number.startsWith("0")) {
                number = "27" + number.substring(1);
            }

            return number;
        }


        function formatDate(dateString) {

            return new Date(dateString)
                .toLocaleString("en-ZA", {
                    dateStyle: "medium",
                    timeStyle: "short"
                });

        }


        function escapeHtml(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>
