<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Curate Memories</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main style="max-width: 500px; margin: 120px auto; padding: 30px;">

        <h1>Curate Memories Admin</h1>

        <p>Admin login</p>

        <form id="adminLogin">

            <input
                type="email"
                id="adminEmail"
                placeholder="Email"
                required
                style="display:block; width:100%; padding:14px; margin:10px 0;">

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
                style="display:block; width:100%; padding:14px; margin:10px 0;">

            <button
                type="submit"
                style="padding:14px 25px; cursor:pointer;">
                LOGIN
            </button>

        </form>

        <p id="adminMessage"></p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
   <script>
document.getElementById("adminLogin").addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = document.getElementById("adminEmail").value;
    const password = document.getElementById("adminPassword").value;
    const message = document.getElementById("adminMessage");

    message.textContent = "Logging in...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    window.location.href = "dashboard.html";

});
</script> 

</body>

</html>
