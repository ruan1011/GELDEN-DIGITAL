<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | Volk & Vuur</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            <img
                src="images/volk-logo.png"
                alt="Volk & Vuur"
            >
        </a>


        <div class="nav-links">

            <a href="index.html#home">
                Home
            </a>

            <a href="index.html#shop">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                Our Story
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </div>


        <a
            href="cart.html"
            class="cart-button"
        >

            <span>🛒</span>

            <span>Cart</span>

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </a>

    </nav>

</header>



<main class="product-page">

    <div
        id="productLoading"
        class="product-loading"
    >
        Loading product...
    </div>


    <div
        id="productError"
        class="product-error"
        style="display:none;"
    >
        <h2>Product not found.</h2>

        <p>
            This product is no longer available.
        </p>

        <a
            href="index.html#shop"
            class="product-back-button"
        >
            Return to Shop
        </a>
    </div>


    <section
        id="productDetails"
        class="product-detail-layout"
        style="display:none;"
    >

        <div class="product-detail-image">

            <img
                id="productImage"
                src=""
                alt=""
            >

        </div>


        <div class="product-detail-info">

            <p
                id="productCategory"
                class="product-category"
            ></p>


            <h1 id="productName"></h1>


            <div
                id="productPrice"
                class="product-detail-price"
            ></div>


            <p
                id="productDescription"
                class="product-detail-description"
            ></p>


            <div
                id="productStock"
                class="product-stock"
            ></div>


            <div class="product-quantity">

                <button
                    type="button"
                    id="quantityMinus"
                >
                    −
                </button>

                <span id="quantityValue">
                    1
                </span>

                <button
                    type="button"
                    id="quantityPlus"
                >
                    +
                </button>

            </div>


            <button
                type="button"
                id="addToCartButton"
                class="product-add-button"
            >
                Add to Cart
            </button>


            <a
                href="index.html#shop"
                class="product-back-link"
            >
                ← Back to Shop
            </a>

        </div>

    </section>

</main>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase.js"></script>

<script src="js/main.js"></script>

</body>

</html>
