<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed | Volk & Vuur</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="site-header">

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            <img
                src="images/volk-logo.png"
                alt="Volk & Vuur"
            >
        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#shop">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                Our Story
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </div>


        <a
            href="cart.html"
            class="cart-button"
        >

            <span>🛒</span>

            <span>
                Cart
            </span>

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </a>

    </nav>

</header>



<main>

<section class="confirmation-page">


    <div class="confirmation-content">


        <div class="confirmation-icon">
            ✓
        </div>


        <p class="eyebrow">
            VOLK & VUUR
        </p>


        <h1>
            Order<br>
            <span>Received.</span>
        </h1>


        <p
            class="confirmation-message"
            id="confirmationMessage"
        >
            Thank you for your order.
        </p>


        <div class="confirmation-order">

            <div>

                <span>
                    ORDER
                </span>

                <strong id="orderNumber">
                    #VV-000000
                </strong>

            </div>


            <div>

                <span>
                    TOTAL
                </span>

                <strong id="confirmationTotal">
                    R0
                </strong>

            </div>

        </div>


        <p class="confirmation-note">

            Your order has been received successfully.
            We will contact you with the next
            steps.

        </p>


        <a
            href="index.html"
            class="story-button"
        >
            Back to Shop
        </a>


    </div>

</section>

</main>



<footer class="footer">

    <p>
        © 2025 Volk & Vuur.
        Alles vir die perfekte braai.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>

</body>

</html>
