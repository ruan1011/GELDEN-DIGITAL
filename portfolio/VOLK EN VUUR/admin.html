<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Volk & Vuur</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="admin-body">

    <main class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-login-logo">

                <img
                    src="images/volk-logo.png"
                    alt="Volk & Vuur"
                >

            </div>


            <p class="eyebrow">
                VOLK & VUUR
            </p>


            <h1>
                Admin<br>
                <span>Portal.</span>
            </h1>


            <p class="admin-login-intro">
                Sign in to manage your store.
            </p>


            <form id="adminLoginForm">

                <div class="form-field">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="admin@volkenvuur.co.za"
                        required
                    >

                </div>


                <div class="form-field">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Your password"
                        required
                    >

                </div>


                <p
                    id="adminLoginError"
                    class="admin-login-error"
                ></p>


                <button
                    type="submit"
                    class="place-order-button"
                >
                    Sign In
                </button>

            </form>


            <a
                href="index.html"
                class="back-to-cart"
            >
                ← Back to Shop
            </a>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
